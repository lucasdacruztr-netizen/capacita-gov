<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPACITA GOV</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f6f9; color: #333; }
        .hidden { display: none; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        button { background: #4285F4; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #357ae8; }
        #admin-panel { margin-top: 20px; border: 2px dashed #007bff; padding: 15px; background: #eef5ff; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>CAPACITA GOV</h1>
        
        <!-- Botão de Login com Google -->
        <div id="auth-section">
            <p>Faça login para aceder aos conteúdos.</p>
            <button id="login-btn">Entrar com o Google</button>
        </div>

        <!-- Área restrita que aparece após o login -->
        <div id="app-section" class="hidden">
            <h2 id="user-greeting"></h2>
            <button id="logout-btn" style="background: #d9534f;">Sair</button>
            
            <!-- Painel exclusivo do Administrador -->
            <div id="admin-panel" class="hidden">
                <h3>Painel do Administrador</h3>
                <p>Aqui você poderá gerir os cursos em breve.</p>
            </div>

            <div style="margin-top: 20px;">
                <h3>Cursos Disponíveis</h3>
                <div id="lista-cursos">Nenhum curso cadastrado ainda.</div>
            </div>
        </div>
    </div>

    <!-- Script de Integração com Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        // Chaves exatas do seu projeto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAjStzMeS40DpIgFEH2Bi4Y80oy8Eel5tE",
            authDomain: "capacita-gov.firebaseapp.com",
            projectId: "capacita-gov",
            storageBucket: "capacita-gov.appspot.com",
            messagingSenderId: "861908221423",
            appId: "1:861908221423:web:39c6d3e24313946bb4a1a",
            measurementId: "G-2L1PEZ0LY7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const authSection = document.getElementById("auth-section");
        const appSection = document.getElementById("app-section");
        const userGreeting = document.getElementById("user-greeting");
        const adminPanel = document.getElementById("admin-panel");

        // O SEU E-MAIL DE ADMINISTRADOR
        const EMAIL_ADMIN = "lucasdaacruztr@gmail.com";

        // Ação de clicar no botão "Entrar com o Google"
        loginBtn.addEventListener("click", async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Erro no login:", error);
                alert("Erro ao tentar fazer login.");
            }
        });

        // Ação de sair da conta
        logoutBtn.addEventListener("click", () => signOut(auth));

        // Monitora se o usuário está logado ou não
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.classList.add("hidden");
                appSection.classList.remove("hidden");
                userGreeting.innerText = `Olá, ${user.displayName}!`;

                // Verifica se o usuário logado é o administrador
                if (user.email === EMAIL_ADMIN) {
                    adminPanel.classList.remove("hidden"); // Mostra ferramentas de admin
                } else {
                    adminPanel.classList.add("hidden"); // Esconde se for aluno comum
                }
            } else {
                authSection.classList.remove("hidden");
                appSection.classList.add("hidden");
            }
        });
    </script>
</body>
</html>
